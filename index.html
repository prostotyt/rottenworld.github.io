<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotten World: Point of No Return</title>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --yellow: #F5E642;
            --yellow-glass: rgba(245, 230, 66, 0.2);
            --black: #000000;
            --glass: rgba(255, 255, 255, 0.05);
            --blur: blur(15px);
            --font: 'Unbounded', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--black);
            color: white;
            font-family: var(--font);
            overflow-x: hidden;
        }

        /* --- Желтый блок сверху (Header) --- */
        .site-header {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 100;
            background: var(--yellow-glass);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border-bottom: 1px solid var(--yellow);
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-episode {
            font-size: 24px;
            font-weight: 900;
            color: var(--yellow);
            text-shadow: 0 0 15px rgba(245, 230, 66, 0.5);
        }

        .exit-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid white;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- Контент (Ридер) --- */
        .reader {
            margin-top: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .page-item {
            width: 100%;
            max-width: 800px;
            margin-bottom: 0;
            transition: opacity 0.5s ease;
        }

        .page-item img {
            width: 100%;
            display: block;
        }

        .placeholder {
            background: #111;
            height: 600px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px dashed #333;
            color: #444;
            text-align: center;
            padding: 20px;
        }

        /* --- Окно выбора (Choices) --- */
        .choice-overlay {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: translateY(100%);
            transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 150;
        }

        .choice-overlay.active { transform: translateY(0); }

        .choice-btn {
            background: var(--glass);
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: var(--blur);
            color: white;
            padding: 15px 30px;
            margin: 10px;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            max-width: 400px;
            font-family: var(--font);
            font-size: 14px;
            transition: all 0.3s ease;
            text-align: left;
        }

        .choice-btn:hover {
            background: var(--yellow-glass);
            border-color: var(--yellow);
            transform: scale(1.02);
        }

        /* --- Сезоны --- */
        #season-selector {
            position: fixed;
            inset: 0;
            background: black;
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .season-card {
            background: var(--glass);
            padding: 30px;
            margin: 10px;
            border-radius: 20px;
            width: 250px;
            text-align: center;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1);
            transition: 0.3s;
        }

        .season-card:hover { border-color: var(--yellow); background: var(--yellow-glass); }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="season-selector">
        <h1 style="margin-bottom: 40px; font-weight: 900;">SELECT SEASON</h1>
        <div class="season-card" onclick="startApp(1)">
            <div style="color: var(--yellow); font-size: 12px; margin-bottom: 10px;">01</div>
            <div style="font-size: 20px;">SEASON ONE</div>
        </div>
        <div class="season-card" onclick="startApp(2)">
            <div style="color: var(--yellow); font-size: 12px; margin-bottom: 10px;">02</div>
            <div style="font-size: 20px;">SEASON TWO</div>
        </div>
    </div>

    <div id="main-app" class="hidden">
        <header class="site-header">
            <button class="exit-btn" onclick="location.reload()">✕</button>
            <div class="header-episode" id="ep-badge">01</div>
            <div style="width: 40px;"></div> </header>

        <div class="reader" id="content-area">
            </div>

        <div id="choice-ui" class="choice-overlay">
            <p id="choice-text" style="margin-bottom: 20px; font-size: 12px; opacity: 0.7;">ЧТО СДЕЛАТЬ?</p>
            <div id="choice-buttons" style="width: 100%; display: flex; flex-direction: column; align-items: center;"></div>
        </div>
    </div>

    <script>
        // === ТВОЯ ЗОНА РЕДАКТИРОВАНИЯ ===
        const MANGA_DATA = {
            season1: [
                {
                    id: "01",
                    title: "Начало",
                    pages: [
                        { type: "placeholder", text: "Рен идет по руинам (Картинка 1)" },
                        { type: "placeholder", text: "Он замечает шевеление в обломках (Картинка 2)" },
                        { type: "placeholder", text: "Встреча с Мирой (Картинка 3)" }
                    ],
                    choice: {
                        question: "Рен стоит перед девочкой. Что сказать?",
                        options: [
                            { text: "1. Эй, девочка, что с тобой?", nextId: "02" },
                            { text: "2. Что случилось?", nextId: "02" }
                        ]
                    }
                },
                {
                    id: "02",
                    title: "Диалог",
                    pages: [
                        { type: "placeholder", text: "Мира поднимает глаза. Они красные. (Картинка 4)" },
                        { type: "placeholder", text: "Она молчит, но протягивает руку. (Картинка 5)" }
                    ]
                }
            ],
            season2: []
        };

        let currentSeason = 1;

        function startApp(sNum) {
            currentSeason = sNum;
            document.getElementById('season-selector').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            loadEpisode("01");
        }

        function loadEpisode(epId) {
            const ep = MANGA_DATA[`season${currentSeason}`].find(e => e.id === epId);
            if (!ep) return;

            const area = document.getElementById('content-area');
            document.getElementById('ep-badge').innerText = ep.id;

            // Добавляем страницы
            ep.pages.forEach(p => {
                const div = document.createElement('div');
                div.className = 'page-item';
                div.innerHTML = `<div class="placeholder">${p.text}</div>`;
                area.appendChild(div);
            });

            // Проверяем наличие выбора
            if (ep.choice) {
                setTimeout(() => {
                    const choiceUI = document.getElementById('choice-ui');
                    const btnArea = document.getElementById('choice-buttons');
                    document.getElementById('choice-text').innerText = ep.choice.question;
                    
                    btnArea.innerHTML = '';
                    ep.choice.options.forEach(opt => {
                        const b = document.createElement('button');
                        b.className = 'choice-btn';
                        b.innerText = opt.text;
                        b.onclick = () => {
                            choiceUI.classList.remove('active');
                            loadEpisode(opt.nextId);
                        };
                        btnArea.appendChild(b);
                    });
                    
                    choiceUI.classList.add('active');
                }, 1000); // Показываем выбор после небольшой задержки
            }
        }

        // Плавный скролл при добавлении контента
        window.onscroll = function() {
            // Тут можно добавить логику авто-подгрузки следующей серии, 
            // если она не привязана к выбору
        };
    </script>
</body>
</html>
