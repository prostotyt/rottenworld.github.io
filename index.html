<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotten World: Visual System</title>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --yellow: #F5E642;
            --yellow-glass: rgba(245, 230, 66, 0.15);
            --black: #000000;
            --font: 'Unbounded', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--black); color: white; font-family: var(--font); overflow: hidden; }

        /* Шапка */
        .site-header {
            position: fixed;
            top: 0; width: 100%; z-index: 1000;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            padding: 30px; display: flex; justify-content: center;
        }
        .ep-badge {
            background: var(--yellow); color: black; padding: 5px 20px;
            border-radius: 50px; font-weight: 900; font-size: 14px;
        }

        /* Контейнер для одной картинки */
        .scene-container {
            height: 100vh; width: 100vw;
            display: flex; align-items: center; justify-content: center;
            position: relative; overflow: hidden;
        }

        .main-art {
            max-width: 100%; max-height: 100%;
            object-fit: contain;
            transition: opacity 1s ease, transform 1.5s ease;
            opacity: 0; transform: scale(1.1);
        }
        .main-art.active { opacity: 1; transform: scale(1); }

        /* Окно диалога (внизу) */
        .dialogue-box {
            position: absolute; bottom: 50px;
            width: calc(100% - 40px); max-width: 700px;
            background: rgba(15, 15, 15, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 30px; border-radius: 24px;
            opacity: 0; transform: translateY(30px);
            transition: 0.5s ease; z-index: 500;
        }
        .dialogue-box.active { opacity: 1; transform: translateY(0); }

        /* Кнопки выбора */
        .choice-list { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .choice-btn {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: white; padding: 15px; border-radius: 12px;
            cursor: pointer; font-family: var(--font); font-size: 13px;
            transition: 0.3s; text-align: left;
        }
        .choice-btn:hover { background: var(--yellow); color: black; }

        /* Таймер/Прогресс (когда девочка говорит) */
        .speech-timer {
            height: 3px; background: var(--yellow); width: 0%;
            position: absolute; bottom: 0; left: 0;
            transition: width linear;
        }

        .instruction {
            position: absolute; bottom: 20px; font-size: 10px;
            opacity: 0.4; letter-spacing: 2px;
        }
    </style>
</head>
<body onclick="nextStep()">

    <header class="site-header">
        <div class="ep-badge" id="ep-title">EP 01</div>
    </header>

    <div class="scene-container">
        <img id="scene-img" src="" class="main-art">
        
        <div id="dialog-ui" class="dialogue-box">
            <p id="dialog-text" style="font-size: 14px; line-height: 1.6;"></p>
            <div id="choices" class="choice-list"></div>
            <div id="timer" class="speech-timer"></div>
        </div>

        <div class="instruction">НАЖМИ НА ЭКРАН, ЧТОБЫ ПРОДОЛЖИТЬ</div>
    </div>

    <script>
        // === ТВОЙ РЕДАКТОР СЮЖЕТА ===
        const STORY = [
            { 
                type: "image", 
                url: "img/art1.jpg", // Сюда путь к фото
                text: "Рен шел по пустым улицам, пока не услышал шорох..."
            },
            {
                type: "choice",
                url: "img/art2.jpg", // Фото, где он нашел девочку
                question: "Рен видит девочку. Что он сделает?",
                options: [
                    { text: "1. Эй, девочка, ты как?", nextIndex: 3 },
                    { text: "2. Что случилось?", nextIndex: 3 }
                ]
            },
            {
                type: "speech",
                url: "img/art3.jpg", // Фото, где девочка отвечает
                text: "Девочка: — Я ждала тебя. Пошли.",
                duration: 3000 // Сколько секунд она "говорит" (3 сек)
            },
            {
                type: "image",
                url: "img/art4.jpg",
                text: "Они двинулись вглубь Гнилого Мира..."
            }
        ];

        let currentIndex = 0;
        let isWaiting = false;

        function updateScene() {
            const step = STORY[currentIndex];
            const img = document.getElementById('scene-img');
            const ui = document.getElementById('dialog-ui');
            const text = document.getElementById('dialog-text');
            const choices = document.getElementById('choices');
            const timer = document.getElementById('timer');

            // 1. Обновляем картинку
            img.classList.remove('active');
            setTimeout(() => {
                img.src = step.url;
                img.classList.add('active');
            }, 100);

            // 2. Логика по типам
            ui.classList.remove('active');
            choices.innerHTML = '';
            timer.style.width = '0%';
            isWaiting = true;

            setTimeout(() => {
                ui.classList.add('active');
                text.innerText = step.text || step.question || "";

                if (step.type === "choice") {
                    isWaiting = true; // Блокируем клик, пока не выберет
                    step.options.forEach(opt => {
                        const btn = document.createElement('button');
                        btn.className = 'choice-btn';
                        btn.innerText = opt.text;
                        btn.onclick = (e) => {
                            e.stopPropagation();
                            currentIndex = opt.nextIndex;
                            updateScene();
                        };
                        choices.appendChild(btn);
                    });
                } else if (step.type === "speech") {
                    isWaiting = true;
                    timer.style.transition = `width ${step.duration}ms linear`;
                    setTimeout(() => timer.style.width = '100%', 50);
                    
                    setTimeout(() => {
                        isWaiting = false; // После речи можно кликать дальше
                    }, step.duration);
                } else {
                    isWaiting = false;
                }
            }, 600);
        }

        function nextStep() {
            if (isWaiting) return; // Если идет речь или выбор - клик не работает
            
            if (currentIndex < STORY.length - 1) {
                currentIndex++;
                updateScene();
            }
        }

        // Запуск
        window.onload = updateScene;
    </script>
</body>
</html>
